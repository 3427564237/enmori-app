## Source review

- The listed source commits were fetched and the complete installed source directories were compared before vendoring. Each upstream licence above was retained.
- Reviewed directories were scanned for destructive commands, credential handling, network access, tool dependencies, and architecture-changing defaults. The lock records every resulting ENMORI compatibility change.
- The `ui-ux-pro-max` runtime/data suite is vendored in full. Its two upstream-maintenance test modules for catalog refresh and relevance evaluation require repository-root tools outside the distributed Skill directory; they are retained but excluded from the repository-Skill test run. Data validation and every self-contained Skill test are required to pass.
- The two rejected third-party Backend candidates are not vendored: `Mindrally/skills` `fastify-typescript` conflicts through Prisma/JWT defaults; `alinaqi/maggy` `firebase` conflicts through client Firestore, Cloud Functions, Google sign-in, and example schemas.

## Final verification

Status: PASS on 2026-09-03.

- All 18 Skill directories passed the Codex `quick_validate.py` validator. Frontmatter names are unique and match their directories; the inventory and this lock contain the same 18-item shared set; all six explicit-only policies resolve to `allow_implicit_invocation: false` and no other Skill does.
- Every declared Skill resource and non-example relative Markdown link resolves. The obsolete `docs/tooling/team-skills.lock` is absent and this root lock is the only provenance lock.
- All retained third-party licence files byte-match their pinned source. Complete vendored directories were diffed against the pinned source directories, and differences are limited to the local modifications recorded above.
- Bash, Node.js, and Python syntax checks pass. `ui-ux-pro-max` validates 12 domain files, 22 stack files, and `ui-reasoning.csv`; its 130 self-contained tests pass; a side-effect-free Flutter search returns the ENMORI 3.47.2 applicability label.
- Security checks found no actual machine path, private-key marker, hard-coded credential, or command that prints a token value. Script findings were reviewed: the Brainstorming companion's browser launch is explicit opt-in, and its stop script validates the per-start server ID before signalling and only recursively removes an ephemeral `/tmp` session directory.
- `git diff --check`, `fvm flutter analyze`, and `fvm flutter test` pass. No product source, dependency manifest, MCP endpoint, or local authentication state is changed by this distribution.

## Update verification — 2026-10-12

This supersedes the source revisions of only the seven updated third-party Skills in the table. The old revisions and local-compatibility changes are retained in [the update record](docs/tooling/skill-update-2026-10-12.md); all unchanged rows and the historical 2026-09-03 verification remain intact. This is a tooling update, not product implementation or Sprint acceptance.

- Seven repository Skills were updated to the audited immutable upstream commits. Personal Skill updates are outside this repository distribution.
- ENMORI local compatibility changes were rebased. Existing explicit-only policies, the approved Flutter 3.47.2 applicability, credential boundaries, and project authority remain in force. The two Figma updates were reverted because their upstream licence changed from Apache-2.0 to Figma Developer Terms; their previous directories and provenance rows remain intact.
- Updated candidates passed Codex quick validation; Python AST, Bash, and Node syntax checks passed. Relative resource links passed after excluding illustrative links inside fenced glossary examples.
- UI/UX data validation passed for 12 domains, 22 stacks, and ui-reasoning.csv. All 137 self-contained tests passed. Four retained upstream-repository maintenance modules are excluded: catalog refresh, catalog summary line endings, relevance evaluator, and upstream installation-path checks; their required repository-root tooling is not part of the distributed Skill.
- The complete updated-source directories were reviewed against the old sources and local changes. Third-party licence files match the retained or new pinned source bytes; the two Figma Skills retain their original Apache-2.0 sources.
- No product code, dependency manifest, plugin, MCP configuration, authentication state, or existing unrelated work was changed. Flutter application suites were not rerun because no product source or dependencies changed.

